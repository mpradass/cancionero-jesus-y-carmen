<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="Un cancionero para celebrar la boda de Jesús y Carmen, el 27 de noviembre de 2026.">
  <title>Jesús + Carmen · Cancionero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="book-shell" aria-label="Cancionero de boda de Jesús y Carmen">
    <header class="masthead" aria-label="Jesús y Carmen">
      <span>JESÚS <i>+</i> CARMEN</span>
      <span class="masthead-date">27 · 11 · 2026</span>
    </header>

    <section class="book" id="book" aria-live="polite">
      <div class="book-shadow" aria-hidden="true"></div>

      <article class="cover" id="cover" aria-label="Portada del cancionero">
        <div class="cover-inner">
          <span class="cover-eyebrow">Un día para recordar</span>
          <span class="cover-rule" aria-hidden="true"></span>
          <h1>JESÚS <span>+</span><br>CARMEN</h1>
          <p class="cover-date">27 · 11 · 2026</p>
          <span class="cover-rule lower" aria-hidden="true"></span>
          <p class="cover-caption">Con amor</p>
          <button class="begin" id="begin" type="button">
            Abrir el cancionero <span aria-hidden="true">→</span>
          </button>
        </div>
        <span class="cover-spine" aria-hidden="true"></span>
      </article>

      <figure class="page" id="page" aria-label="Página del cancionero" aria-live="polite">
        <img id="page-image" src="assets/pagina-2.png" alt="">
      </figure>

      <button class="turn turn-prev" id="prev" type="button" aria-label="Página anterior" disabled>
        <span aria-hidden="true">←</span>
      </button>
      <button class="turn turn-next" id="next" type="button" aria-label="Página siguiente">
        <span aria-hidden="true">→</span>
      </button>
    </section>

    <nav class="book-nav" aria-label="Navegación del cancionero">
      <button id="nav-prev" class="text-turn" type="button" disabled>Anterior</button>
      <div class="page-meta">
        <span class="page-count" id="page-count">Portada</span>
        <span class="page-name" id="page-name">Jesús + Carmen</span>
        <div class="progress" role="progressbar" aria-label="Progreso del cancionero" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="progress">
          <span id="progress-fill"></span>
        </div>
      </div>
      <button id="nav-next" class="text-turn" type="button">Comenzar <span aria-hidden="true">→</span></button>
    </nav>
    <p class="hint" id="hint">Pulsa «Comenzar» para abrir</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
